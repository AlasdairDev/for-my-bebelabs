name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build static site
        run: |
          mkdir -p _site
          cp -R index.html 404.html favicon.png robots.txt site.webmanifest css js images part2 _site/
          cp .nojekyll _site/
          SHA="${GITHUB_SHA::8}"
          find _site -name '*.html' -exec sed -i "s/?v=dev/?v=${SHA}/g" {} +

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
